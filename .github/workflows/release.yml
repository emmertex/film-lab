name: release

# Push a tag `vX.Y.Z` matching `crates/photocraft/Cargo.toml` to publish a GitHub release with the
# plug-in modules. Run it by hand (Actions › release › Run workflow) to build the modules as a
# workflow artifact without releasing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --manifest-path crates/photocraft/Cargo.toml \
            | jq -r '.packages[] | select(.name == "film-lab-photocraft") | .version')
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match crates/photocraft/Cargo.toml (v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: build
        run: crates/photocraft/build.sh --locked
      - name: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for name in film_lab_convert film_lab_convert_advanced; do
            cp "crates/photocraft/target/wasm32-unknown-unknown/release/$name.wasm" dist/
            # The manifest is a string in the data segment: a module must carry the version released.
            grep -q -a "\"version\": \"$VERSION\"" "dist/$name.wasm" \
              || { echo "::error::$name.wasm's manifest does not say version $VERSION"; exit 1; }
          done
          cd dist
          sha256sum ./*.wasm | sed 's| \./| |' > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: film-lab-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: film-lab-${{ needs.build.outputs.version }}
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          # A version with a suffix (0.2.0-rc.1) is a pre-release.
          case "$VERSION" in *-*) pre=--prerelease ;; *) pre= ;; esac
          cat > notes.md <<EOF
          Film Lab $VERSION for PhotoCraft (plug-in ABI v1).

          Two plug-ins, one module each; install either or both:

          - \`film_lab_convert.wasm\`: **Filter › Plug-ins › Film Lab: Convert Negative…**, a film
            preset and six sliders.
          - \`film_lab_convert_advanced.wasm\`: **Filter › Plug-ins › Film Lab: Convert Negative
            (Advanced)…**, with the film base picked from the border (Film Base Red / Green / Blue,
            as the Info panel shows it), tone, white balance, a gray point, colour and sharpening.

          Install: run \`plugin.install {"path": "/abs/path/film_lab_convert.wasm"}\`, or copy the
          files into the folder set in Edit › Preferences › Plug-ins. Replacing a file upgrades it;
          the names stay the same across versions.

          Check the downloads: \`shasum -a 256 -c SHA256SUMS\`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Film Lab $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            $pre
